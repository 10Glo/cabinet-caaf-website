version: '3'

services:
  payload:
    image: node:18-alpine
    ports:
      - '3000:3000'
    volumes:
      - .:/home/node/app
      - node_modules:/home/node/app/node_modules
    working_dir: /home/node/app/
    command: sh -c "corepack enable && corepack prepare pnpm@latest --activate && pnpm install && pnpm dev"
    depends_on:
      - postgres
    env_file:
      - .env

  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: N4kW2domemQ9tY6p
      POSTGRES_DB: cabinet-caaf-website
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5439:5432"

volumes:
  pgdata:
  node_modules:
